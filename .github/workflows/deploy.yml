name: Build And Deploy Utility App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build App
        run: pnpm run build

      - name: Push to Website Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DEPLOY_TOKEN }}
        with:
          source-directory: 'dist'
          destination-github-username: 'YurMil'
          destination-repository-name: 'cadautoscript.com'
          target-directory: 'static/utility-apps/gear-pair-calculator'
          user-email: 'bot@react-table-editor.com'
          user-name: 'github-actions[bot]'
          commit-message: 'Deploy gear-pair-calculator from ${{ github.sha }}'
          target-branch: main
